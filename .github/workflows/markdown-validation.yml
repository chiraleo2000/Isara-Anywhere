name: Markdown Validation

on:
  push:
    paths:
      - '**.md'
      - '.markdownlintrc.json'
  pull_request:
    paths:
      - '**.md'
      - '.markdownlintrc.json'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    name: Validate Markdown

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install -g markdownlint-cli

      - name: Run Markdown Validation
        id: validate
        continue-on-error: true
        run: |
          markdownlint --config .markdownlintrc.json '**/*.md' > lint-report.txt 2>&1 || echo "Linting completed with warnings"
          cat lint-report.txt

      - name: Check for Critical Issues
        run: |
          if grep -q "MD\|error" lint-report.txt; then
            echo "❌ Markdown issues found. Please review the report above."
            echo ""
            echo "To fix automatically, run locally:"
            echo "  node scripts/markdown-fixer.js --path ./Processes"
            exit 1
          else
            echo "✅ All markdown files are valid!"
          fi

      - name: Upload Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-validation-report
          path: lint-report.txt
          retention-days: 30

  markdown-auto-fix-check:
    runs-on: ubuntu-latest
    name: Check Auto-Fix Availability

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Check-Only Mode
        id: check
        continue-on-error: true
        run: |
          node scripts/markdown-fixer.js --check-only || true

      - name: Comment on PR (if changes would be made)
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '💡 **Markdown Auto-Fix Available**\n\nRun this command to automatically fix markdown formatting issues:\n```bash\nnode scripts/markdown-fixer.js --path ./Processes\n```\n\nAfter running, commit and push the changes.'
            })
