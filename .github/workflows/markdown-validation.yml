name: Markdown Validation

on:
  push:
    paths:
      - '**.md'
      - 'scripts/markdown-fixer.js'
  pull_request:
    paths:
      - '**.md'
      - 'scripts/markdown-fixer.js'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    name: Validate Markdown

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Markdown Check (check-only)
        run: node scripts/markdown-fixer.js --check-only

  markdown-auto-fix-hint:
    runs-on: ubuntu-latest
    name: PR fix hint
    if: github.event_name == 'pull_request' && failure()
    needs: markdown-lint

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Markdown check failed. Fix locally:\n```bash\nnode scripts/markdown-fixer.js\n```'
            });
