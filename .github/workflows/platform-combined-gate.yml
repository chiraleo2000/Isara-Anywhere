name: Platform Combined Gate

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  combined-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: cd tests/unit && npm ci
      - run: npm run test:unit:process-contracts
      - run: npm run phase:0
      - name: Standalone orchestrator (unit/contract only without docker)
        run: npm run test:meeting-server:contract
      # Full pre-deploy-gate requires docker compose + headed E2E — run locally or self-hosted runner
