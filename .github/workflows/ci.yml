name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # 1. Unit tests + coverage (Vitest)
  # ────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Install unit-test deps
        run: npm ci --prefer-offline --no-audit --progress=false
        working-directory: tests/unit

      - name: Install patient-portal deps
        run: npm ci --prefer-offline --no-audit --progress=false
        working-directory: Isara-patient-portal

      - name: Install doctor-portal deps
        run: npm ci --prefer-offline --no-audit --progress=false
        working-directory: Isara-doctor-portal

      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: tests/unit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/unit/coverage/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────
  # 2. Security audit — fail on any HIGH/CRITICAL in production deps
  # ────────────────────────────────────────────────────────────────────────
  security-audit:
    name: npm audit (production-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit patient-portal
        run: npm audit --omit=dev --audit-level=high
        working-directory: Isara-patient-portal

      - name: Audit doctor-portal
        run: npm audit --omit=dev --audit-level=high
        working-directory: Isara-doctor-portal

      - name: Audit jitsi-server
        run: npm audit --omit=dev --audit-level=high
        working-directory: Izara-jitsi-server

  # ────────────────────────────────────────────────────────────────────────
  # 3. Secret scanner — reject PRs that reintroduce hardcoded DB passwords
  # ────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (hardcoded fallbacks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Reject IzaraDb2024 in source
        run: |
          if grep -rnE "\|\|\s*['\"]IzaraDb2024['\"]" \
            --include='*.ts' --include='*.js' --include='*.cjs' --include='*.mjs' \
            --include='*.yml' --include='*.yaml' --include='Dockerfile*' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            --exclude='*.test.*' --exclude='test-*.ps1' \
            .; then
            echo "::error::Hardcoded password fallback '|| IzaraDb2024' reintroduced"
            exit 1
          fi

      - name: Reject JWT_SECRET default fallbacks
        run: |
          if grep -rnE "JWT_SECRET\s*\|\|\s*['\"]" \
            --include='*.ts' --include='*.js' --include='*.cjs' --include='*.mjs' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            --exclude='*.test.*' \
            .; then
            echo "::error::JWT_SECRET must fail-fast, no string fallback allowed"
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────
  # 4. Docker build matrix — verify every Dockerfile still builds
  # ────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: patient-portal
            context: Isara-patient-portal
            dockerfile: Isara-patient-portal/Dockerfile.unified
          - service: doctor-portal
            context: Isara-doctor-portal
            dockerfile: Isara-doctor-portal/Dockerfile.unified
          - service: meeting-server
            context: Izara-jitsi-server
            dockerfile: Izara-jitsi-server/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ────────────────────────────────────────────────────────────────────────
  # 5. Playwright E2E against docker-compose stack
  # ────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: Playwright E2E (docker-compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit-tests, security-audit, secret-scan]
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_DB: izara_phase1
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      VITE_GEMINI_API_KEY: ${{ secrets.CI_GEMINI_API_KEY }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.CI_GOOGLE_MAPS_API_KEY }}
      VITE_GEMINI_MODEL: gemini-2.5-flash-lite
      RATE_LIMIT_MAX: "999999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root deps (Playwright)
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Write .env.docker
        run: |
          cat > .env.docker <<EOF
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          JWT_SECRET=$JWT_SECRET
          VITE_GEMINI_API_KEY=$VITE_GEMINI_API_KEY
          VITE_GEMINI_MODEL=$VITE_GEMINI_MODEL
          VITE_GOOGLE_MAPS_API_KEY=$VITE_GOOGLE_MAPS_API_KEY
          RATE_LIMIT_MAX=$RATE_LIMIT_MAX
          EOF

      - name: Start compose stack
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3005/health \
               && curl -sf http://localhost:3010/health \
               && curl -sf http://localhost:3020/health; then
              echo "All services healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Services failed to become healthy"
          docker compose logs --tail=80
          exit 1

      - name: Run Playwright (all groups)
        env:
          CI: "1"
        run: npx playwright test --reporter=list --workers=2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
