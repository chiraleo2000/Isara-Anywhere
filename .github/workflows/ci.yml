name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly full local gate (headed phase 9)
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Tier 1 — PR fast (~15 min): structure, unit waves, contracts, lint, secrets
  # ────────────────────────────────────────────────────────────────────────
  pr-fast:
    name: PR fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: |
          npm ci --prefer-offline --no-audit --progress=false
          cd tests/unit && npm ci --prefer-offline --no-audit --progress=false
          cd ../Isara-patient-portal && npm ci --prefer-offline --no-audit --progress=false
          cd ../Isara-doctor-portal && npm ci --prefer-offline --no-audit --progress=false
          cd ../Izara-jitsi-server && npm ci --prefer-offline --no-audit --progress=false

      - name: Phase 0 structure
        run: npm run phase:0

      - name: Unit waves (fail-fast)
        run: node scripts/run-unit-groups-sequential.mjs --fail-fast

      - name: Meeting server contract
        run: npm run test:meeting-server:contract

      - name: Static guards
        run: npm run test:guards:static

      - name: Portal lint + typecheck
        run: npm run test:lint:portals:full

      - name: Secret scan (hardcoded fallbacks)
        run: |
          if grep -rnE "\|\|\s*['\"]IzaraDb2024['\"]" \
            --include='*.ts' --include='*.js' --include='*.cjs' --include='*.mjs' \
            --include='*.yml' --include='*.yaml' --include='Dockerfile*' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            --exclude='*.test.*' --exclude='test-*.ps1' \
            .; then
            echo "::error::Hardcoded password fallback '|| IzaraDb2024' reintroduced"
            exit 1
          fi
          if grep -rnE "JWT_SECRET\s*\|\|\s*['\"]" \
            --include='*.ts' --include='*.js' --include='*.cjs' --include='*.mjs' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
            --exclude='*.test.*' \
            .; then
            echo "::error::JWT_SECRET must fail-fast, no string fallback allowed"
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────
  # Security audit (parallel to PR fast)
  # ────────────────────────────────────────────────────────────────────────
  security-audit:
    name: npm audit (production-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit patient-portal
        run: npm audit --omit=dev --audit-level=high
        working-directory: Isara-patient-portal

      - name: Audit doctor-portal
        run: npm audit --omit=dev --audit-level=high
        working-directory: Isara-doctor-portal

      - name: Audit jitsi-server
        run: npm audit --omit=dev --audit-level=high
        working-directory: Izara-jitsi-server

  cve-lite-scan:
    name: OWASP CVE Lite (dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root deps (cve-lite-cli)
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Install production lockfiles
        run: |
          npm ci --prefix Isara-patient-portal --omit=dev --prefer-offline --no-audit --progress=false
          npm ci --prefix Isara-doctor-portal --omit=dev --prefer-offline --no-audit --progress=false
          npm ci --prefix Izara-jitsi-server --omit=dev --prefer-offline --no-audit --progress=false

      - name: CVE Lite scan (fail-on high)
        run: npm run security:cve-lite

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: patient-portal
            context: .
            dockerfile: Isara-patient-portal/Dockerfile.unified
          - service: doctor-portal
            context: .
            dockerfile: Isara-doctor-portal/Dockerfile.unified
          - service: meeting-server
            context: Izara-jitsi-server
            dockerfile: Izara-jitsi-server/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ────────────────────────────────────────────────────────────────────────
  # Tier 2 — PR docker E2E (label run-docker-e2e or push to main)
  # ────────────────────────────────────────────────────────────────────────
  pr-docker-e2e:
    name: Playwright E2E (docker, headless subset)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [pr-fast, security-audit, cve-lite-scan]
    if: |
      github.event_name != 'schedule' && (
        github.ref == 'refs/heads/main' ||
        contains(github.event.pull_request.labels.*.name, 'run-docker-e2e')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set E2E stack credentials
        run: |
          echo "POSTGRES_USER=postgres" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=ci_postgres_e2e_${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=izara_phase1" >> "$GITHUB_ENV"
          echo "JWT_SECRET=ci-jwt-e2e-secret-minimum-32-characters" >> "$GITHUB_ENV"
          echo "VITE_GEMINI_API_KEY=ci-placeholder-gemini" >> "$GITHUB_ENV"
          echo "VITE_GOOGLE_MAPS_API_KEY=ci-placeholder-maps" >> "$GITHUB_ENV"
          echo "VITE_GEMINI_MODEL=gemini-3.1-flash-lite" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_MAX=999999" >> "$GITHUB_ENV"

      - name: Install root deps (Playwright)
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Write .env.docker
        run: |
          cat > .env.docker <<EOF
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          JWT_SECRET=$JWT_SECRET
          VITE_GEMINI_API_KEY=$VITE_GEMINI_API_KEY
          VITE_GEMINI_MODEL=$VITE_GEMINI_MODEL
          VITE_GOOGLE_MAPS_API_KEY=$VITE_GOOGLE_MAPS_API_KEY
          RATE_LIMIT_MAX=$RATE_LIMIT_MAX
          EOF

      - name: Start compose stack
        run: docker compose --env-file .env.docker up -d --build

      - name: Docker probe + meeting API smoke
        run: npm run docker:probe-health && npm run docker:meeting-api-smoke

      - name: Run Playwright (A-auth + Q-meeting-lifecycle, headless)
        env:
          CI: "1"
          PW_HEADLESS: "1"
          PW_WORKERS: "1"
          PW_SKIP_LIVE_GEMINI: "1"
          PATIENT_URL: http://127.0.0.1:3005
          DOCTOR_URL: http://127.0.0.1:3010
          MEETING_URL: http://127.0.0.1:3020
        run: npx playwright test --project=A-auth --project=Q-meeting-lifecycle --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-docker
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose --env-file .env.docker logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.docker down -v

  # ────────────────────────────────────────────────────────────────────────
  # Tier 3 — Nightly full local gate (phase 9)
  # ────────────────────────────────────────────────────────────────────────
  nightly-phase9:
    name: Nightly phase 9 (full local gate)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm run verify:deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Write .env.docker
        run: |
          cat > .env.docker <<EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci_nightly_${{ github.run_id }}
          POSTGRES_DB=izara_phase1
          JWT_SECRET=ci-jwt-nightly-secret-minimum-32-characters
          VITE_GEMINI_API_KEY=ci-placeholder-gemini
          VITE_GEMINI_MODEL=gemini-3.1-flash-lite
          VITE_GOOGLE_MAPS_API_KEY=ci-placeholder-maps
          RATE_LIMIT_MAX=999999
          EOF

      - name: Phase 9 full gate
        env:
          GATE_SKIP_DOCKER_BUILD: "1"
          PW_SKIP_LIVE_GEMINI: "1"
        run: npm run phase:9

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-phase9-artifacts
          path: |
            reports/
            test-results/
            playwright-report/
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.docker down -v || true
