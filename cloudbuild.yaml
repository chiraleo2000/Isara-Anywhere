# Root Cloud Build — Issara Anywhere (aligned with sibling portal cloudbuilds)
# Used by: scripts/deploy-cloud-from-env.ps1 → gcloud builds submit --config=cloudbuild.yaml
#
# Build contexts are sibling junctions (issara-patient / issara-doctor / issara-jitsi).
# Dockerfiles use flat COPY (repo root = context).
#
# Cloud Postgres = GCE VM 35.240.157.230 only (NOT Cloud SQL /cloudsql sockets).

substitutions:
  _TAG: 'v1.7.62'
  _REGION: 'asia-southeast1'
  _PROJECT: 'izara-telemedicine'
  _DB_HOST: '35.240.157.230'
  _MEETING_SERVER_URL: 'https://izara-meeting-server-dev-testing-724889190329.asia-southeast1.run.app'
  _REGISTRY: 'asia-southeast1-docker.pkg.dev/izara-telemedicine/isara-anywhere-portals'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

steps:
  - id: build-patient
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.unified'
      - '-t'
      - '${_REGISTRY}/izara-patient-portal:${_TAG}'
      - '-t'
      - '${_REGISTRY}/izara-patient-portal:latest'
      - '--build-arg'
      - 'VITE_APP_ENV=production'
      - '--build-arg'
      - 'VITE_APP_VERSION=2.0.0'
      - '--build-arg'
      - 'VITE_GCP_PROJECT_ID=${_PROJECT}'
      - '--build-arg'
      - 'VITE_MEETING_SERVER_URL=${_MEETING_SERVER_URL}'
      - '.'
    dir: 'issara-patient'

  - id: build-doctor
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.unified'
      - '-t'
      - '${_REGISTRY}/izara-doctor-portal:${_TAG}'
      - '-t'
      - '${_REGISTRY}/izara-doctor-portal:latest'
      - '--build-arg'
      - 'VITE_APP_ENV=production'
      - '--build-arg'
      - 'VITE_APP_VERSION=2.0.0'
      - '--build-arg'
      - 'VITE_GCP_PROJECT_ID=${_PROJECT}'
      - '--build-arg'
      - 'VITE_MEETING_SERVER_URL=${_MEETING_SERVER_URL}'
      - '.'
    dir: 'issara-doctor'
    waitFor: ['-']

  - id: build-meeting
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile'
      - '-t'
      - '${_REGISTRY}/izara-jitsi-meeting:${_TAG}'
      - '-t'
      - '${_REGISTRY}/izara-jitsi-meeting:latest'
      - '.'
    dir: 'issara-jitsi'
    waitFor: ['-']

  - id: push-patient
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGISTRY}/izara-patient-portal']
    waitFor: ['build-patient']

  - id: push-doctor
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGISTRY}/izara-doctor-portal']
    waitFor: ['build-doctor']

  - id: push-meeting
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGISTRY}/izara-jitsi-meeting']
    waitFor: ['build-meeting']

  - id: deploy-patient
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'izara-patient-portal-dev-testing'
      - '--image=${_REGISTRY}/izara-patient-portal:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3005'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=2'
      - '--timeout=300'
      - '--execution-environment=gen2'
      - '--cpu-boost'
      - '--clear-cloudsql-instances'
      - '--set-env-vars=NODE_ENV=production,USE_EMBEDDED_PG=false,DB_HOST=${_DB_HOST},DB_PORT=5432,DB_NAME=izara_phase1,DB_USER=postgres,DB_SSL=false,USE_POSTGRESQL=true,VITE_USE_POSTGRESQL=true,JITSI_DOMAIN=meet.jit.si,VITE_JITSI_DOMAIN=meet.jit.si,GEMINI_MODEL=gemini-3.1-flash-lite,GCP_PROJECT_ID=${_PROJECT},MEETING_SERVER_URL=${_MEETING_SERVER_URL},VITE_MEETING_SERVER_URL=${_MEETING_SERVER_URL},IZARA_DEV_TESTING=1,GOOGLE_TOKEN_VERIFIER_FIXTURE=1,NODE_OPTIONS=--max-old-space-size=768 --max-semi-space-size=64,UV_THREADPOOL_SIZE=4'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VITE_GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=db-password:latest,JWT_SECRET=jwt-secret:latest,VITE_GOOGLE_MAPS_API_KEY=google-maps-api-key:latest,GOOGLE_CLIENT_ID=google-client-id:latest'
      - '--quiet'
    waitFor: ['push-patient']

  - id: deploy-doctor
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'izara-doctor-portal-dev-testing'
      - '--image=${_REGISTRY}/izara-doctor-portal:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=2'
      - '--timeout=300'
      - '--cpu-boost'
      - '--execution-environment=gen2'
      - '--clear-cloudsql-instances'
      - '--set-env-vars=NODE_ENV=production,USE_EMBEDDED_PG=false,DB_HOST=${_DB_HOST},DB_PORT=5432,DB_NAME=izara_phase1,DB_USER=postgres,DB_SSL=false,USE_POSTGRESQL=true,VITE_USE_POSTGRESQL=true,JITSI_DOMAIN=meet.jit.si,GEMINI_MODEL=gemini-3.1-flash-lite,GCP_PROJECT_ID=${_PROJECT},MEETING_SERVER_URL=${_MEETING_SERVER_URL},VITE_MEETING_SERVER_URL=${_MEETING_SERVER_URL},IZARA_DEV_TESTING=1,GOOGLE_TOKEN_VERIFIER_FIXTURE=1,UPLOADS_DIR=/app/uploads,NODE_OPTIONS=--max-old-space-size=768 --max-semi-space-size=64,UV_THREADPOOL_SIZE=4,AUTH_NODE_OPTIONS=--max-old-space-size=256 --max-semi-space-size=32,MAIN_NODE_OPTIONS=--max-old-space-size=448 --max-semi-space-size=48'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VITE_GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=db-password:latest,JWT_SECRET=jwt-secret:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_SPEECH_API_KEY=google-speech-api-key:latest'
      - '--quiet'
    waitFor: ['push-doctor']

  - id: deploy-meeting
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'izara-meeting-server-dev-testing'
      - '--image=${_REGISTRY}/izara-jitsi-meeting:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3020'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--timeout=600'
      - '--cpu-boost'
      # meet.demotoday.net is LAN-only — cloud E2E needs public meet.jit.si (see CLOUD_ACCESS_TH.md)
      - '--clear-cloudsql-instances'
      - '--set-env-vars=NODE_ENV=production,USE_POSTGRESQL=true,DB_HOST=35.240.157.230,DB_PORT=5432,DB_NAME=izara_phase1,DB_USER=postgres,DB_SSL=false,JITSI_DOMAIN=meet.jit.si,GEMINI_MODEL=gemini-3.1-flash-lite,IZARA_DEV_TESTING=1'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,JWT_SECRET=jwt-secret:latest,DB_PASSWORD=db-password:latest,GOOGLE_SPEECH_API_KEY=google-speech-api-key:latest'
      - '--quiet'
    waitFor: ['push-meeting']

images:
  - '${_REGISTRY}/izara-patient-portal:${_TAG}'
  - '${_REGISTRY}/izara-patient-portal:latest'
  - '${_REGISTRY}/izara-doctor-portal:${_TAG}'
  - '${_REGISTRY}/izara-doctor-portal:latest'
  - '${_REGISTRY}/izara-jitsi-meeting:${_TAG}'
  - '${_REGISTRY}/izara-jitsi-meeting:latest'

timeout: 3600s
