# ============================================================================
# Izara Telemedicine — Root Cloud Build Configuration v1.6.0
# Orchestrates build & deploy of all 3 Cloud Run services
#
# Usage:
#   gcloud builds submit . --config=cloudbuild.yaml
#   gcloud builds submit . --config=cloudbuild.yaml --substitutions=_TAG=v1.7.0
#
# Required Secret Manager secrets (run setup-cloud-build.ps1 first):
#   jwt-secret, db-password, database-url, gemini-api-key, google-maps-api-key
#
# Build flow:
#   1. Build all 3 Docker images in parallel
#   2. Push all 3 images in parallel
#   3. Deploy Meeting Server (portals need its URL)
#   4. Deploy Patient Portal + Doctor Portal in parallel
#   5. Update Meeting Server CORS with portal URLs
# ============================================================================

substitutions:
  _REGION: asia-southeast1
  _REGISTRY: asia-southeast1-docker.pkg.dev/izara-telemedicine/isara-anywhere-portals
  _TAG: v1.6.0
  _DB_HOST: "35.240.157.230"
  _DB_PORT: "5432"
  _DB_NAME: izara_phase1
  _DB_USER: postgres
  _GEMINI_MODEL: gemini-2.5-flash-lite
  _JITSI_DOMAIN: meet.jit.si
  _PATIENT_SVC: izara-patient-portal-dev-testing
  _DOCTOR_SVC: izara-doctor-portal-dev-testing
  _MEETING_SVC: izara-meeting-server-dev-testing

steps:
  # ============================================================
  # PHASE 1: BUILD — all 3 images build in parallel
  # ============================================================

  - id: build-meeting-server
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGISTRY}/izara-jitsi-meeting:${_TAG}
      - -t
      - ${_REGISTRY}/izara-jitsi-meeting:latest
      - .
    dir: Izara-jitsi-server
    waitFor: ["-"]

  - id: build-patient-portal
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.unified
      - -t
      - ${_REGISTRY}/izara-patient-portal:${_TAG}
      - -t
      - ${_REGISTRY}/izara-patient-portal:latest
      - --build-arg
      - VITE_APP_ENV=production
      - --build-arg
      - VITE_APP_VERSION=2.0.0
      - --build-arg
      - VITE_GCP_PROJECT_ID=${PROJECT_ID}
      - --build-arg
      - VITE_USE_POSTGRESQL=true
      - --build-arg
      - VITE_USE_GCS=false
      - .
    dir: Isara-patient-portal
    waitFor: ["-"]

  - id: build-doctor-portal
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.unified
      - -t
      - ${_REGISTRY}/izara-doctor-portal:${_TAG}
      - -t
      - ${_REGISTRY}/izara-doctor-portal:latest
      - --build-arg
      - VITE_APP_ENV=production
      - --build-arg
      - VITE_APP_VERSION=2.0.0
      - --build-arg
      - VITE_GCP_PROJECT_ID=${PROJECT_ID}
      - --build-arg
      - VITE_USE_POSTGRESQL=true
      - --build-arg
      - VITE_USE_GCS=false
      - .
    dir: Isara-doctor-portal
    waitFor: ["-"]

  # ============================================================
  # PHASE 2: PUSH — all 3 images pushed in parallel
  # ============================================================

  - id: push-meeting-server
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/izara-jitsi-meeting
    waitFor:
      - build-meeting-server

  - id: push-patient-portal
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/izara-patient-portal
    waitFor:
      - build-patient-portal

  - id: push-doctor-portal
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/izara-doctor-portal
    waitFor:
      - build-doctor-portal

  # ============================================================
  # PHASE 3: DEPLOY Meeting Server (portals depend on its URL)
  # ============================================================

  - id: deploy-meeting-server
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_MEETING_SVC}
      - --image=${_REGISTRY}/izara-jitsi-meeting:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3020
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --timeout=600
      - --cpu-boost
      - --set-env-vars=NODE_ENV=production,USE_POSTGRESQL=true,DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_SSL=false,JITSI_DOMAIN=${_JITSI_DOMAIN},GEMINI_MODEL=${_GEMINI_MODEL},CORS_ORIGINS=*
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,JWT_SECRET=jwt-secret:latest,DB_PASSWORD=db-password:latest,DATABASE_URL=database-url:latest
    waitFor: [push-meeting-server]

  # Capture the meeting server URL for portals and write to /workspace
  - id: get-meeting-url
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        URL=$(gcloud run services describe ${_MEETING_SVC} \
          --region=${_REGION} --format='value(status.url)')
        echo "Meeting Server URL: $$URL"
        printf '%s' "$$URL" > /workspace/meeting_url.txt
    waitFor: [deploy-meeting-server]

  # ============================================================
  # PHASE 4: DEPLOY Portals (parallel — both need meeting URL)
  # ============================================================

  - id: deploy-patient-portal
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        MEETING_URL=$(cat /workspace/meeting_url.txt)
        echo "Deploying Patient Portal with meeting URL: $$MEETING_URL"
        gcloud run deploy ${_PATIENT_SVC} \
          --image=${_REGISTRY}/izara-patient-portal:${_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=3005 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=2 \
          --timeout=300 \
          --set-env-vars="NODE_ENV=production,DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_SSL=false,USE_POSTGRESQL=true,VITE_USE_POSTGRESQL=true,GEMINI_MODEL=${_GEMINI_MODEL},GCP_PROJECT_ID=${PROJECT_ID},MEETING_SERVER_URL=$$MEETING_URL,VITE_MEETING_SERVER_URL=$$MEETING_URL" \
          --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VITE_GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=db-password:latest,DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,VITE_GOOGLE_MAPS_API_KEY=google-maps-api-key:latest
    waitFor: [push-patient-portal, get-meeting-url]

  - id: deploy-doctor-portal
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        MEETING_URL=$(cat /workspace/meeting_url.txt)
        echo "Deploying Doctor Portal with meeting URL: $$MEETING_URL"
        gcloud run deploy ${_DOCTOR_SVC} \
          --image=${_REGISTRY}/izara-doctor-portal:${_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=2 \
          --timeout=300 \
          --execution-environment=gen2 \
          --cpu-boost \
          --set-env-vars="NODE_ENV=production,DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_SSL=false,USE_POSTGRESQL=true,VITE_USE_POSTGRESQL=true,JITSI_DOMAIN=${_JITSI_DOMAIN},GEMINI_MODEL=${_GEMINI_MODEL},GCP_PROJECT_ID=${PROJECT_ID},MEETING_SERVER_URL=$$MEETING_URL,VITE_MEETING_SERVER_URL=$$MEETING_URL" \
          --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VITE_GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=db-password:latest,DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest
    waitFor: [push-doctor-portal, get-meeting-url]

  # ============================================================
  # PHASE 5: UPDATE CORS on Meeting Server with portal URLs
  # ============================================================

  - id: update-meeting-cors
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        PATIENT_URL=$(gcloud run services describe ${_PATIENT_SVC} \
          --region=${_REGION} --format='value(status.url)')
        DOCTOR_URL=$(gcloud run services describe ${_DOCTOR_SVC} \
          --region=${_REGION} --format='value(status.url)')
        CORS_VAL="$${PATIENT_URL},$${DOCTOR_URL}"
        echo "CORS: $$CORS_VAL"
        gcloud run services update ${_MEETING_SVC} \
          --region=${_REGION} \
          --update-env-vars="^##^CORS_ORIGINS=$$CORS_VAL"
    waitFor: [deploy-patient-portal, deploy-doctor-portal]

# Store all built images in Artifact Registry
images:
  - ${_REGISTRY}/izara-jitsi-meeting:${_TAG}
  - ${_REGISTRY}/izara-jitsi-meeting:latest
  - ${_REGISTRY}/izara-patient-portal:${_TAG}
  - ${_REGISTRY}/izara-patient-portal:latest
  - ${_REGISTRY}/izara-doctor-portal:${_TAG}
  - ${_REGISTRY}/izara-doctor-portal:latest

# 40 minutes total (parallel builds keep this reasonable)
timeout: 2400s

options:
  logging: CLOUD_LOGGING_ONLY
  # High-CPU machine speeds up parallel Docker builds
  machineType: E2_HIGHCPU_8
