# Cloud Build — Izara Patient Portal (dev-testing)
# Aligned with Cloud Run revision izara-patient-portal-dev-testing-00107-nmv (2026-05-27)
# Image tag: v1.7.12 · Cloud SQL (NOT GCE VM)

substitutions:
  _TAG: v1.7.12
  _CLOUDSQL: "izara-telemedicine:asia-southeast1:izara-postgres-server"
  _DB_HOST: "/cloudsql/izara-telemedicine:asia-southeast1:izara-postgres-server"
  _MEETING_SERVER_URL: "https://izara-meeting-server-dev-testing-hvht4obouq-as.a.run.app"

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "Dockerfile.unified"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal:${_TAG}"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal:latest"
      - "--build-arg"
      - "VITE_APP_ENV=production"
      - "--build-arg"
      - "VITE_APP_VERSION=2.0.0"
      - "--build-arg"
      - "VITE_GCP_PROJECT_ID=$PROJECT_ID"
      - "--build-arg"
      - "VITE_MEETING_SERVER_URL=${_MEETING_SERVER_URL}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal"

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "izara-patient-portal-dev-testing"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal:${_TAG}"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=3005"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--min-instances=1"
      - "--max-instances=2"
      - "--timeout=300"
      - "--execution-environment=gen2"
      - "--cpu-boost"
      - "--add-cloudsql-instances=${_CLOUDSQL}"
      - "--set-env-vars=NODE_ENV=production,USE_EMBEDDED_PG=false,CLOUDSQL_INSTANCE=${_CLOUDSQL},DB_HOST=${_DB_HOST},DB_PORT=5432,DB_NAME=izara_phase1,DB_USER=postgres,DB_SSL=true,USE_POSTGRESQL=true,VITE_USE_POSTGRESQL=true,GEMINI_MODEL=gemini-2.5-flash-lite,GCP_PROJECT_ID=$PROJECT_ID,MEETING_SERVER_URL=${_MEETING_SERVER_URL},VITE_MEETING_SERVER_URL=${_MEETING_SERVER_URL},IZARA_DEV_TESTING=1,GOOGLE_TOKEN_VERIFIER_FIXTURE=1,NODE_OPTIONS=--max-old-space-size=768 --max-semi-space-size=64,UV_THREADPOOL_SIZE=4"
      - "--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VITE_GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=db-password:latest,DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,VITE_GOOGLE_MAPS_API_KEY=google-maps-api-key:latest,GOOGLE_CLIENT_ID=google-client-id:latest"

images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal:${_TAG}"
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal:latest"

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
