# Cloud Build configuration for Izara Patient Portal
# Builds unified Docker image and deploys to Cloud Run

steps:
  # Build the unified Docker image with secrets as build args
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          -f Dockerfile.unified \
          -t gcr.io/$PROJECT_ID/izara-patient-portal:$COMMIT_SHA \
          -t gcr.io/$PROJECT_ID/izara-patient-portal:latest \
          --build-arg VITE_APP_ENV=production \
          --build-arg VITE_GCP_PROJECT_ID=$PROJECT_ID \
          --build-arg VITE_GOOGLE_MAPS_API_KEY=$$GOOGLE_MAPS_API_KEY \
          --build-arg VITE_GEMINI_API_KEY=$$GEMINI_API_KEY \
          .
    secretEnv: ['GOOGLE_MAPS_API_KEY', 'GEMINI_API_KEY']

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/izara-patient-portal:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/izara-patient-portal:latest'

  # Deploy to Cloud Run with Cloud SQL Unix socket connection
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'izara-patient-portal'
      - '--image=gcr.io/$PROJECT_ID/izara-patient-portal:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3005'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--add-cloudsql-instances=izara-telemedicine:asia-southeast1:izara-db-instance'
      - '--set-env-vars=NODE_ENV=production,USE_POSTGRESQL=true,VITE_USE_POSTGRESQL=true,VITE_GCP_PROJECT_ID=$PROJECT_ID,VITE_GCP_REGION=asia-southeast1,DB_HOST=/cloudsql/izara-telemedicine:asia-southeast1:izara-db-instance,DB_NAME=izara_phase1,DB_USER=izara_localdb_admin'
      - '--set-secrets=DB_PASSWORD=db-password:latest'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/izara-patient-portal:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/izara-patient-portal:latest'

# Build timeout (20 minutes)
timeout: '1200s'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Secrets for build
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/google-maps-api-key/versions/latest
      env: 'GOOGLE_MAPS_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/gemini-api-key/versions/latest
      env: 'GEMINI_API_KEY'
