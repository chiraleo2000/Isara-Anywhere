# Cloud Build — Izara Patient Portal (dev-testing)
# DB: GCE VM PostgreSQL (NOT Cloud SQL) — aligned with root cloudbuild.yaml
# AI: gemini-3.1-flash-lite (cost-optimized; 2.5-flash-lite removed — breaks AI)

substitutions:
  _TAG: v1.7.12
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "2"
  _DB_HOST: "35.240.157.230"
  _DB_PORT: "5432"
  _DB_NAME: izara_phase1
  _DB_USER: postgres
  _GEMINI_MODEL: gemini-3.1-flash-lite
  _MEETING_SERVER_URL: "https://izara-meeting-server-dev-testing-724889190329.asia-southeast1.run.app"

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "Dockerfile.unified"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal:${_TAG}"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal:latest"
      - "--build-arg"
      - "VITE_APP_ENV=production"
      - "--build-arg"
      - "VITE_APP_VERSION=2.0.0"
      - "--build-arg"
      - "VITE_GCP_PROJECT_ID=$PROJECT_ID"
      - "--build-arg"
      - "VITE_MEETING_SERVER_URL=${_MEETING_SERVER_URL}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal"

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "izara-patient-portal-dev-testing"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal:${_TAG}"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=3005"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--min-instances=${_MIN_INSTANCES}"
      - "--max-instances=${_MAX_INSTANCES}"
      - "--concurrency=80"
      - "--timeout=300"
      - "--set-env-vars=NODE_ENV=production,DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_SSL=false,USE_POSTGRESQL=true,VITE_USE_POSTGRESQL=true,GEMINI_MODEL=${_GEMINI_MODEL},VITE_GEMINI_MODEL=${_GEMINI_MODEL},GCP_PROJECT_ID=$PROJECT_ID,MEETING_SERVER_URL=${_MEETING_SERVER_URL},VITE_MEETING_SERVER_URL=${_MEETING_SERVER_URL},IZARA_DEV_TESTING=1,GOOGLE_TOKEN_VERIFIER_FIXTURE=1,NODE_OPTIONS=--max-old-space-size=768"
      - "--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VITE_GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=db-password:latest,DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,VITE_GOOGLE_MAPS_API_KEY=google-maps-api-key:latest,GOOGLE_CLIENT_ID=google-client-id:latest"

images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal:${_TAG}"
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-patient-portal:latest"

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_MEDIUM"
