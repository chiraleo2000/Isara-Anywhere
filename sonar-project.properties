# SonarQube Configuration for Izara Telemedicine Platform
# =====================================================
# Run: sonar-scanner (CLI) or use SonarLint in VS Code IDE

sonar.projectKey=izara-telemedicine
sonar.projectName=Izara Telemedicine Platform
sonar.projectVersion=1.7.47

# Source directories
sonar.sources=Isara-patient-portal/src,Isara-patient-portal/server,Isara-doctor-portal/src,Isara-doctor-portal/server,Izara-jitsi-server/server

# Test directories
sonar.tests=tests

# Exclusions — node_modules, build output, generated files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.expo/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/test-results/**,screenshots/**,credentials/**

# Language-specific settings
sonar.javascript.lcov.reportPaths=tests/unit/coverage/lcov.info,coverage/lcov.info
sonar.typescript.lcov.reportPaths=tests/unit/coverage/lcov.info,coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# ----------------------------------------------------------------------------
# Rule suppressions (multicriteria)
# ----------------------------------------------------------------------------
# S7020 (docker): nginx add_header directives for Permissions-Policy and
#   Content-Security-Policy must be emitted as single logical lines. Splitting
#   them breaks nginx parsing. Documented in Dockerfile.unified with NOSONAR.
# S6747 / S6766 (typescript): false positives on LoginPage/ProfilePage and large clinical
#   components (CompleteEMREditor, CompletePrescribing, LiveTranscription) — valid JSX; Sonar parser cascade.
# S6438: parser cascade on same large TSX files (comments already use {/* */}).
# Web:S5725 (html-diagrams): offline Mermaid CDN; SRI omitted so pinned CDN updates do not break viewing.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S7020
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile.unified
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.e2.resourceKey=**/pages/auth/LoginPage.tsx
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6766
sonar.issue.ignore.multicriteria.e3.resourceKey=**/pages/auth/LoginPage.tsx
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.e4.resourceKey=**/pages/ProfilePage.tsx
sonar.issue.ignore.multicriteria.e5.ruleKey=Web:S5725
sonar.issue.ignore.multicriteria.e5.resourceKey=**/Presentations/html-diagrams/**
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.e6.resourceKey=**/pages/MapPage.tsx
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.e7.resourceKey=**/components/CompleteEMREditor.tsx
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.e8.resourceKey=**/components/CompletePrescribing.tsx
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.e9.resourceKey=**/components/LiveTranscription.tsx
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S6438
sonar.issue.ignore.multicriteria.e10.resourceKey=**/components/CompleteEMREditor.tsx
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S6438
