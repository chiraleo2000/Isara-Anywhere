# SonarQube Configuration for Izara Telemedicine Platform
# =====================================================
# Run: sonar-scanner (CLI) or use SonarLint in VS Code IDE

sonar.projectKey=izara-telemedicine
sonar.projectName=Izara Telemedicine Platform
sonar.projectVersion=1.5.9

# Source directories
sonar.sources=Isara-patient-portal/src,Isara-doctor-portal/src,Izara-jitsi-server/server,Isara-mobile-app/src

# Test directories
sonar.tests=tests,Isara-mobile-app/src/__tests__

# Exclusions — node_modules, build output, generated files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.expo/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/test-results/**,screenshots/**,credentials/**

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
