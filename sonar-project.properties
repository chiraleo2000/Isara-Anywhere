# SonarQube Configuration for Izara Telemedicine Platform
# =====================================================
# Run: sonar-scanner (CLI) or use SonarLint in VS Code IDE

sonar.projectKey=izara-telemedicine
sonar.projectName=Izara Telemedicine Platform
sonar.projectVersion=1.7.56

# Source directories
sonar.sources=Isara-patient-portal/frontend,Isara-patient-portal/backend,Isara-doctor-portal/frontend,Isara-doctor-portal/backend,Izara-jitsi-server/backend

# Test directories
sonar.tests=tests

# Exclusions — node_modules, build output, generated files, local dev runtime config
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.expo/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/test-results/**,screenshots/**,credentials/**,**/frontend/public/env-config.js,**/public/env-config.js,**/Dockerfile*,scripts/jitsi/**,scripts/gates/**,scripts/run-local-pre-deploy-gate.mjs,playwright.config.ts

sonar.test.exclusions=**/node_modules/**,tests/unit/**

# Language-specific settings
sonar.javascript.lcov.reportPaths=tests/unit/coverage/lcov.info,coverage/lcov.info
sonar.typescript.lcov.reportPaths=tests/unit/coverage/lcov.info,coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# ----------------------------------------------------------------------------
# Rule suppressions (multicriteria) — SonarLint standalone reads these
# ----------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,e31,e32,e33,e34,e35,e36,e37,e38,e39,e40,e41,e42,e43,e44,e45

# Docker nginx long lines + secrets + root user + merged RUN
