# ============================================================================
# IZARA TELEMEDICINE - COMPLETE DOCKER COMPOSE
# Version: 1.4.8-dev
# Updated: 2026-02-12
# ============================================================================
#
# This docker-compose provides:
# - PostgreSQL 18 with pgvector for primary database
# - pgAdmin for database management
# - Patient Portal (unified frontend + backend on port 3005)
# - Doctor Portal (unified frontend + backend on port 3010)
# - Meeting Server (transcription + AI on port 3020)
#
# ALL SERVICES USE FREE TIER:
#   - Video: Jitsi Meet (meet.jit.si) - FREE
#   - Transcription: Web Speech API (browser-native) - FREE
#   - AI: Gemini 2.5 Flash Lite - FREE
#   - Database: PostgreSQL + pgvector - FREE
#
# Run: docker-compose up --build
# Access:
#   - Patient Portal: http://localhost:3005
#   - Doctor Portal:  http://localhost:3010
#   - Meeting Server: http://localhost:3020
#   - pgAdmin:        http://localhost:5050
# ============================================================================

services:
  # ==========================================================================
  # PostgreSQL Database with pgvector
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg18
    container_name: izara-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-izara_phase1}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/database/izara-database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d izara_phase1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - izara-network

  # ==========================================================================
  # pgAdmin for Database Management
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: izara-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@izara.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-IzaraAdmin@2024}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izara-network

  # ==========================================================================
  # Patient Portal - Unified (Frontend + Backend on port 3005)
  # ==========================================================================
  patient-portal:
    build:
      context: ./Isara-patient-portal
      dockerfile: Dockerfile.unified
      args:
        VITE_API_URL: http://localhost:3005
        VITE_APP_NAME: Izara Patient Portal
        VITE_APP_VERSION: 1.4.8-dev
        VITE_APP_ENV: production
        VITE_USE_POSTGRESQL: "true"
        VITE_MEETING_SERVER_URL: http://localhost:3020
        # Google Maps API - loaded from .env.docker
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID}
        # Gemini AI - loaded from .env.docker
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY}
        VITE_GEMINI_MODEL: ${VITE_GEMINI_MODEL}
    container_name: izara-patient-portal
    restart: unless-stopped
    env_file:
      - .env.docker
      - ./Isara-patient-portal/.env
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3005

      # DEMO MODE - Disabled for local Docker (use real PostgreSQL)
      DEMO_MODE: "false"

      # Database Configuration - Docker internal network
      # NOTE: URL-encode special characters in POSTGRES_PASSWORD for DATABASE_URL
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-izara_phase1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: izara_phase1
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
      USE_POSTGRESQL: "true"
      VITE_USE_POSTGRESQL: "true"

      # GCS DISABLED - PostgreSQL only
      USE_GCS: "false"
      VITE_USE_GCS: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/service-account.json

      # Meeting Server URL
      MEETING_SERVER_URL: http://meeting-server:3020
      VITE_MEETING_SERVER_URL: http://localhost:3020

      # Google Maps server-side API key
      GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    volumes:
      - ./credentials/service-account.json:/app/credentials/service-account.json:ro
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izara-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Doctor Portal - Unified (Frontend + Backend on port 3010)
  # ==========================================================================
  doctor-portal:
    build:
      context: ./Isara-doctor-portal
      dockerfile: Dockerfile.unified
      args:
        VITE_API_URL: http://localhost:3010
        VITE_AUTH_URL: http://localhost:3010/auth
        VITE_APP_NAME: Izara Doctor Portal
        VITE_APP_VERSION: 1.4.8-dev
        VITE_APP_ENV: production
        VITE_USE_POSTGRESQL: "true"
        VITE_MEETING_SERVER_URL: http://localhost:3020
    container_name: izara-doctor-portal
    restart: unless-stopped
    env_file:
      - .env.docker
      - ./Isara-doctor-portal/.env
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3010
      AUTH_PORT: 3010
      GCS_API_PORT: 3010

      # DEMO MODE - Disabled for local Docker (use real PostgreSQL)
      DEMO_MODE: "false"

      # Database Configuration - Docker internal network
      # NOTE: URL-encode special characters in POSTGRES_PASSWORD for DATABASE_URL
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-izara_phase1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: izara_phase1
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
      USE_POSTGRESQL: "true"
      VITE_USE_POSTGRESQL: "true"

      # GCS DISABLED - PostgreSQL only
      USE_GCS: "false"
      VITE_USE_GCS: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/service-account.json

      # GCS API URL (internal)
      GCS_API_URL: http://localhost:3010

      # Meeting Server URL
      MEETING_SERVER_URL: http://meeting-server:3020
      VITE_MEETING_SERVER_URL: http://localhost:3020
    volumes:
      - ./credentials/service-account.json:/app/credentials/service-account.json:ro
    ports:
      - "3010:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izara-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Jitsi Meeting Server - Transcription & AI Summary (port 3020)
  # ==========================================================================
  meeting-server:
    build:
      context: ./Izara-jitsi-server
      dockerfile: Dockerfile
    container_name: izara-meeting-server
    restart: unless-stopped
    env_file:
      - .env.docker
      - ./Izara-jitsi-server/.env
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3020

      # Database Configuration - Docker internal network
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-izara_phase1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-izara_phase1}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Jitsi Configuration - loaded from .env.docker
      JITSI_DOMAIN: ${JITSI_DOMAIN}

      # Gemini AI Configuration - loaded from .env.docker
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}

      # Transcription: Web Speech API (browser-native, FREE - no API key needed)
      # GOOGLE_SPEECH_API_KEY is NOT required

      # CORS
      CORS_ORIGINS: http://localhost:3005,http://localhost:3010
    volumes:
      - ./credentials/service-account.json:/app/credentials/service-account.json:ro
    ports:
      - "3020:3020"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izara-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3020/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  izara-network:
    driver: bridge
