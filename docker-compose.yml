# =============================================================================
# IZARA Telemedicine Platform - Docker Compose
# Deploys: issara-jitsi + issara-patient + issara-doctor
# Uses EXISTING PostgreSQL on host machine (not containerized)
# =============================================================================
# Usage:
#   docker-compose up --build        (build & run all services)
#   docker-compose up -d             (run in background)
#   docker-compose down              (stop all services)
#
# All services connect to the host PostgreSQL via DB_HOST / DB_PORT in .env
# =============================================================================

services:
  # ===========================================================================
  # issara-jitsi — Meeting/Video Server (port 3020)
  # Contract alias: meeting-server (same service; docs/tests may say meeting-server)
  # ===========================================================================
  issara-jitsi:
    profiles: ['full']
    build:
      context: ../issara-jitsi
      dockerfile: Dockerfile.local
    container_name: izara-jitsi-server
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3020:3020"
    environment:
      NODE_ENV: production
      # Local E2E: enable /api/meetings/:id/dev/reset-lobby and related test hooks
      IZARA_DEV_TESTING: ${IZARA_DEV_TESTING:-1}
      PORT: 3020
      # Database (shared Docker network). Use COMPOSE_DB_HOST so host .env DB_HOST=localhost
      # does not break in-container DNS (container name: izara-postgres).
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-IzaraDb2024}@${COMPOSE_DB_HOST:-izara-postgres}:${DB_INTERNAL_PORT:-5432}/${DB_NAME:-izara_phase1}
      DB_HOST: ${COMPOSE_DB_HOST:-izara-postgres}
      DB_PORT: ${DB_INTERNAL_PORT:-5432}
      DB_NAME: ${DB_NAME:-izara_phase1}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-IzaraDb2024}
      # Jitsi
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.demotoday.net}
      JITSI_XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      JITSI_APP_ID: ${JITSI_APP_ID:-izara-telemedicine}
      JITSI_JWT_SECRET: ${JITSI_JWT_SECRET:-21toTKg9Q7auYZF6h0wXd4Y0nBfj4T40zCA9DdHTSm4=}
      JITSI_JWT_AUDIENCE: ${JITSI_JWT_AUDIENCE:-izara-telemedicine}
      JITSI_JWT_ISSUER: ${JITSI_JWT_ISSUER:-izara-telemedicine}
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-izara-jwt-secret-key-phase1-2026}
      JWT_EXPIRES_IN: 24h
      # CORS (allow patient & doctor portals)
      CORS_ORIGINS: http://localhost:3005,http://localhost:3010,http://${SERVER_IP:-192.168.10.239}:3005,http://${SERVER_IP:-192.168.10.239}:3010,http://issara-patient:3005,http://issara-doctor:3010
      # Recordings — ใช้ค่า RECORDINGS_DIR จาก .env เป็น host path, mount เข้า /app/recordings
      RECORDINGS_DIR: /app/recordings
      RECORDING_ENCRYPTION_KEY: ${RECORDING_ENCRYPTION_KEY:-izara-recording-encryption-key-2026}
      JIBRI_WEBHOOK_SECRET: ${JIBRI_WEBHOOK_SECRET:-izara-jibri-webhook-secret-2026}
      # Google Speech
      GOOGLE_SPEECH_API_KEY: ${GOOGLE_SPEECH_API_KEY:-}
      GOOGLE_STT_ENABLED: ${GOOGLE_STT_ENABLED:-true}
      GOOGLE_STT_LANGUAGE: th-TH
      # OpenAI (Whisper transcription for post-meeting pipeline)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Logging
      LOG_LEVEL: info
    volumes:
      - ${RECORDINGS_DIR:-./data/recordings}:/app/recordings
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3020/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - izara-shared

  # ===========================================================================
  # issara-patient — Patient Portal (port 3005)
  # Frontend (Vite/React) + Backend (Express/tsx) unified container
  # ===========================================================================
  issara-patient:
    profiles: ['full']
    build:
      context: ../issara-patient
      dockerfile: Dockerfile.compose
      args:
        VITE_APP_NAME: "Izara Patient Portal"
        VITE_APP_VERSION: "2.0.0"
        VITE_API_URL: ${PATIENT_API_URL:-http://localhost:3005}
        VITE_MEETING_SERVER_URL: ${MEETING_PUBLIC_URL:-http://127.0.0.1:3020}
        VITE_JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.demotoday.net}
        VITE_JITSI_APP_ID: ${JITSI_APP_ID:-izara-telemedicine}
        VITE_GCP_PROJECT_ID: ${GCP_PROJECT_ID:-izara-telemedicine}
        VITE_GCP_REGION: ${GCP_REGION:-asia-southeast1}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-724889190329-svf2733fjqklfic9tet9d2qkmhkgmu0l.apps.googleusercontent.com}
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
        VITE_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
        VITE_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
        VITE_PDPA_ENABLED: "true"
        VITE_AUDIT_LOGGING_ENABLED: "true"
    container_name: izara-patient-portal
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      issara-jitsi:
        condition: service_healthy
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      # Database (shared Docker network) — COMPOSE_DB_HOST, not host .env DB_HOST
      USE_EMBEDDED_PG: "false"
      USE_POSTGRESQL: "true"
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-IzaraDb2024}@${COMPOSE_DB_HOST:-izara-postgres}:${DB_INTERNAL_PORT:-5432}/${DB_NAME:-izara_phase1}
      DB_HOST: ${COMPOSE_DB_HOST:-izara-postgres}
      DB_PORT: ${DB_INTERNAL_PORT:-5432}
      DB_NAME: ${DB_NAME:-izara_phase1}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-IzaraDb2024}
      # Runtime URLs
      VITE_API_URL: ${PATIENT_API_URL:-http://localhost:3005}
      VITE_MEETING_SERVER_URL: ${MEETING_PUBLIC_URL:-http://127.0.0.1:3020}
      MEETING_SERVER_URL: http://issara-jitsi:3020
      # Auth
      JWT_SECRET: ${JWT_SECRET:-izara-jwt-secret-key-phase1-2026}
      E2E_ALLOW_PARALLEL_SESSIONS: ${E2E_ALLOW_PARALLEL_SESSIONS:-1}
      SESSION_EXPIRES_MINUTES: ${SESSION_EXPIRES_MINUTES:-120}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-724889190329-svf2733fjqklfic9tet9d2qkmhkgmu0l.apps.googleusercontent.com}
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      # Jitsi
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.demotoday.net}
      # Portal URLs (used for meeting links & notifications)
      PATIENT_PORTAL_URL: ${PATIENT_API_URL:-http://localhost:3005}
      APP_URL: ${PATIENT_API_URL:-http://localhost:3005}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@izara.com}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    networks:
      - izara-shared

  # ===========================================================================
  # issara-doctor — Doctor Portal (port 3010)
  # Frontend (Nginx) + Backend (authServer:3011, mainApiServer:3009) unified
  # ===========================================================================
  issara-doctor:
    profiles: ['full']
    build:
      context: ../issara-doctor
      dockerfile: Dockerfile.compose
      args:
        VITE_APP_NAME: "Izara Doctor Portal"
        VITE_APP_VERSION: "2.0.0"
        VITE_APP_ENV: "production"
        VITE_API_URL: ${DOCTOR_API_URL:-http://localhost:3010}
        VITE_AUTH_URL: ${DOCTOR_AUTH_URL:-http://localhost:3010/auth}
        VITE_DOCTOR_URL: ${DOCTOR_API_URL:-http://localhost:3010}
        VITE_WEBSOCKET_URL: ${DOCTOR_WS_URL:-ws://localhost:3010/ws}
        VITE_MEETING_SERVER_URL: ${MEETING_PUBLIC_URL:-http://127.0.0.1:3020}
        VITE_JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.demotoday.net}
        VITE_JITSI_APP_ID: ${JITSI_APP_ID:-izara-telemedicine}
        VITE_GCP_PROJECT_ID: ${GCP_PROJECT_ID:-izara-telemedicine}
        VITE_GCP_REGION: ${GCP_REGION:-asia-southeast1}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-724889190329-svf2733fjqklfic9tet9d2qkmhkgmu0l.apps.googleusercontent.com}
        VITE_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
        VITE_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
        VITE_PATIENT_PORTAL_URL: ${PATIENT_API_URL:-http://localhost:3005}
        VITE_PDPA_ENABLED: "true"
        VITE_AUDIT_LOGGING_ENABLED: "true"
    container_name: izara-doctor-portal
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      issara-jitsi:
        condition: service_healthy
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: production
      # Database (shared Docker network) — COMPOSE_DB_HOST, not host .env DB_HOST
      USE_EMBEDDED_PG: "false"
      USE_POSTGRESQL: "true"
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-IzaraDb2024}@${COMPOSE_DB_HOST:-izara-postgres}:${DB_INTERNAL_PORT:-5432}/${DB_NAME:-izara_phase1}
      DB_HOST: ${COMPOSE_DB_HOST:-izara-postgres}
      DB_PORT: ${DB_INTERNAL_PORT:-5432}
      DB_NAME: ${DB_NAME:-izara_phase1}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-IzaraDb2024}
      # Ports
      AUTH_PORT: 3011
      MAIN_API_PORT: 3009
      # Runtime URLs
      VITE_API_URL: ${DOCTOR_API_URL:-http://localhost:3010}
      VITE_AUTH_URL: http://localhost:3011/auth
      VITE_DOCTOR_URL: ${DOCTOR_API_URL:-http://localhost:3010}
      VITE_WEBSOCKET_URL: ${DOCTOR_WS_URL:-ws://localhost:3010/ws}
      VITE_MEETING_SERVER_URL: ${MEETING_PUBLIC_URL:-http://127.0.0.1:3020}
      MEETING_SERVER_URL: http://issara-jitsi:3020
      # Auth
      JWT_SECRET: ${JWT_SECRET:-izara-jwt-secret-key-phase1-2026}
      E2E_ALLOW_PARALLEL_SESSIONS: ${E2E_ALLOW_PARALLEL_SESSIONS:-1}
      SESSION_EXPIRES_MINUTES: ${SESSION_EXPIRES_MINUTES:-120}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-724889190329-svf2733fjqklfic9tet9d2qkmhkgmu0l.apps.googleusercontent.com}
      # Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      # Google APIs
      GOOGLE_SPEECH_API_KEY: ${GOOGLE_SPEECH_API_KEY:-}
      # Jitsi
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.demotoday.net}
      JITSI_APP_ID: ${JITSI_APP_ID:-izara-telemedicine}
      JITSI_JWT_SECRET: ${JITSI_JWT_SECRET:-21toTKg9Q7auYZF6h0wXd4Y0nBfj4T40zCA9DdHTSm4=}
      # SMTP Email (appointment confirmation/decline emails)
      SMTP_PROVIDER: ${SMTP_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@izara.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Izara Telemedicine}
      # App URL (used in email links)
      APP_URL: ${DOCTOR_API_URL:-http://localhost:3010}
      # Patient portal URL (used for meeting links in confirmation emails)
      PATIENT_PORTAL_URL: ${PATIENT_API_URL:-http://localhost:3005}
      VITE_PATIENT_PORTAL_URL: ${PATIENT_API_URL:-http://localhost:3005}
      # File uploads — ใช้ค่า UPLOADS_DIR จาก .env เป็น host path, mount เข้า /app/uploads
      UPLOADS_DIR: /app/uploads
      # CORS
      CORS_ORIGINS: http://localhost:3010,http://localhost:3005,http://localhost:3020,http://${SERVER_IP:-192.168.10.239}:3010,http://${SERVER_IP:-192.168.10.239}:3005,http://${SERVER_IP:-192.168.10.239}:3020
    volumes:
      - ${UPLOADS_DIR:-./data/uploads}:/app/uploads
    healthcheck:
      # Probe mainApi via nginx /api/ — nginx /health alone masks a dead :3009
      test: ["CMD", "curl", "-f", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - izara-shared

# =============================================================================
# Networks
# =============================================================================
networks:
  izara-shared:
    external: true
    name: isara-anywhere_izara-network
