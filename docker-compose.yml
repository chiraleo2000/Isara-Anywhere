# ============================================================================
# IZARA TELEMEDICINE - COMPLETE DOCKER COMPOSE
# Version: 1.7.3
# Updated: 2026-05-18
# ============================================================================
#
# This docker-compose provides:
# - PostgreSQL 18 with pgvector for primary database
# - pgAdmin for database management
# - Patient Portal (unified frontend + backend on port 3005)
# - Doctor Portal (unified frontend + backend on port 3010)
# - Meeting Server (transcription + AI on port 3020)
#
# ALL SERVICES USE FREE TIER:
#   - Video: Jitsi Meet (meet.jit.si) - FREE
#   - Transcription: Web Speech API (browser-native) - FREE
#   - AI: Gemini 2.5 Flash Lite - FREE
#   - Database: PostgreSQL + pgvector - FREE
#
# Run: docker compose up -d --build
# Access (direct on server):
#   - Patient Portal: http://localhost:3005
#   - Doctor Portal:  http://localhost:3010
#   - Meeting Server: http://localhost:3020
#   - pgAdmin:        http://localhost:5050
# LAN via Nginx subdomains: see deploy/nginx/LOCAL_DOCKER_DEPLOYMENT.md (Mode B)
#   patient.isara.local | doctor.isara.local | meeting.isara.local | dbadmin.isara.local
# ============================================================================

services:
  # ==========================================================================
  # PostgreSQL Database with pgvector
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg18
    container_name: izara-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/database/izara-database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/database/migrations/v2.0.0-phase2-tables.sql:/docker-entrypoint-initdb.d/02-phase2.sql:ro
      - ./scripts/database/migrations/v2.1.0-phase2-ai-his.sql:/docker-entrypoint-initdb.d/03-phase2-ai-his.sql:ro
      - ./scripts/database/v2.2.0-notify-triggers.sql:/docker-entrypoint-initdb.d/04-notify-triggers.sql:ro
      - ./scripts/database/seed-dev-data.sql:/docker-entrypoint-initdb.d/05-seed-dev.sql:ro
      - ./scripts/database/migrations/2025-add-google-sub.sql:/docker-entrypoint-initdb.d/06-google-sub.sql:ro
      - ./scripts/database/migrations/2025-ensure-appointment-columns.sql:/docker-entrypoint-initdb.d/07-appointment-columns.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d izara_phase1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - izara-network

  # ==========================================================================
  # pgAdmin for Database Management
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: izara-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@izara.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-IzaraAdmin@2024}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izara-network

  # ==========================================================================
  # Patient Portal - Unified (Frontend + Backend on port 3005)
  # ==========================================================================
  patient-portal:
    build:
      context: .
      dockerfile: Isara-patient-portal/Dockerfile.unified
      args:
        VITE_API_URL: ""
        VITE_APP_NAME: Izara Patient Portal
        VITE_APP_VERSION: 1.7.3
        VITE_APP_ENV: production
        VITE_USE_POSTGRESQL: ${USE_POSTGRESQL:-true}
        VITE_MEETING_SERVER_URL: ${VITE_MEETING_SERVER_URL:-http://localhost:3020}
        VITE_GCP_PROJECT_ID: ${GCP_PROJECT_ID:-izara-telemedicine}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
        VITE_GEMINI_API_KEY: ${GEMINI_API_KEY:-xxxxx}
        VITE_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
        JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}
        VITE_JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}
    container_name: izara-patient-portal
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3005

      # Rate limit — tune per environment (no infinity default)
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-2000}

      # Database Configuration - Docker internal network
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-izara_phase1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: izara_phase1
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      DB_SSL: "false"
      USE_POSTGRESQL: "true"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-izara-telemedicine}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # JWT Secret — must be set in .env (openssl rand -hex 32)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required in .env (generate with openssl rand -hex 32)}

      # Meeting Server URL
      MEETING_SERVER_URL: http://meeting-server:3020
      VITE_MEETING_SERVER_URL: ${VITE_MEETING_SERVER_URL:-http://localhost:3020}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3005,http://localhost:3010,http://localhost:3020,http://patient.isara.local,http://doctor.isara.local,http://meeting.isara.local}
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}

      # Google Maps server-side API key
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-xxxxx}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}

      # Local file storage (no GCS)
      UPLOAD_DIR: /app/uploads
      E2E_ALLOW_PARALLEL_SESSIONS: ${E2E_ALLOW_PARALLEL_SESSIONS:-1}

      # E2E / dev: Google SSO fixture tokens (Group N Playwright)
      IZARA_DEV_TESTING: "1"
      GOOGLE_TOKEN_VERIFIER_FIXTURE: "1"
    volumes:
      - izara_uploads:/app/uploads
      - ./scripts/env:/scripts/env:ro
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izara-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Doctor Portal - Unified (Frontend + Backend on port 3010)
  # ==========================================================================
  doctor-portal:
    build:
      context: .
      dockerfile: Isara-doctor-portal/Dockerfile.unified
      args:
        VITE_API_URL: ""
        VITE_AUTH_URL: ${VITE_AUTH_URL:-}
        VITE_APP_NAME: Izara Doctor Portal
        VITE_APP_VERSION: 1.7.3
        VITE_APP_ENV: production
        VITE_USE_POSTGRESQL: ${USE_POSTGRESQL:-true}
        VITE_MEETING_SERVER_URL: ${VITE_MEETING_SERVER_URL:-http://localhost:3020}
        VITE_GCP_PROJECT_ID: ${GCP_PROJECT_ID:-izara-telemedicine}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_GEMINI_API_KEY: ${GEMINI_API_KEY:-xxxxx}
        VITE_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
        JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}
        VITE_JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}
    container_name: izara-doctor-portal
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3010
      AUTH_PORT: 3010

      # Rate limit — tune per environment
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-2000}

      # Database Configuration - Docker internal network
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-izara_phase1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: izara_phase1
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      DB_SSL: "false"
      USE_POSTGRESQL: "true"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-izara-telemedicine}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-xxxxx}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}

      # JWT Secret — must be set in .env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required in .env (generate with openssl rand -hex 32)}

      # Meeting Server URL
      MEETING_SERVER_URL: http://meeting-server:3020
      VITE_MEETING_SERVER_URL: ${VITE_MEETING_SERVER_URL:-http://localhost:3020}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3005,http://localhost:3010,http://localhost:3020,http://patient.isara.local,http://doctor.isara.local,http://meeting.isara.local}
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}

      # Local file storage (no GCS)
      UPLOAD_DIR: /app/uploads

      # E2E / dev: Google SSO fixture tokens (Group N Playwright)
      IZARA_DEV_TESTING: "1"
      GOOGLE_TOKEN_VERIFIER_FIXTURE: "1"
      E2E_ALLOW_PARALLEL_SESSIONS: ${E2E_ALLOW_PARALLEL_SESSIONS:-1}
    volumes:
      - izara_uploads:/app/uploads
      - ./scripts/env:/scripts/env:ro
    ports:
      - "127.0.0.1:3010:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izara-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Jitsi Meeting Server - Transcription & AI Summary (port 3020)
  # ==========================================================================
  meeting-server:
    build:
      context: .
      dockerfile: Izara-jitsi-server/Dockerfile
    container_name: izara-meeting-server
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3020

      # Rate limit — tune per environment
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-2000}

      # Database Configuration - Docker internal network
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-izara_phase1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-izara_phase1}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}

      # Jitsi Configuration - loaded from .env.docker
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.jit.si}

      # JWT Secret — must be set in .env
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required in .env (generate with openssl rand -hex 32)}

      # Gemini AI Configuration - loaded from .env.docker
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY required in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}

      # Transcription: Web Speech API (browser-native, FREE - no API key needed)

      # CORS — extend via .env.docker (include LAN subdomains when using Nginx)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3005,http://localhost:3010,http://localhost:3020,http://127.0.0.1:3005,http://127.0.0.1:3010,http://127.0.0.1:3020,http://patient.isara.local,http://doctor.isara.local,http://meeting.isara.local}
      RECORDINGS_DIR: /app/recordings
      UPLOAD_DIR: /app/uploads
      IZARA_DEV_TESTING: "1"
      JIBRI_WEBHOOK_SECRET: ${JIBRI_WEBHOOK_SECRET:-izara-jibri-dev-secret}
    volumes:
      - izara_recordings:/app/recordings
      - izara_uploads:/app/uploads
      - ./scripts/env:/scripts/env:ro
    ports:
      - "127.0.0.1:3020:3020"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - izara-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');http.get('http://localhost:3020/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  izara_recordings:
    driver: local
  izara_uploads:
    driver: local

networks:
  izara-network:
    driver: bridge
