# ============================================================================
# IZARA JITSI MEETING SERVER - Docker Compose
# ============================================================================
# 
# This docker-compose provides:
# - Izara Meeting API Server (port 3020)
# - Uses external PostgreSQL from main Izara stack
# 
# Run: docker-compose up -d
# ============================================================================

services:
  # ==========================================================================
  # Izara Meeting API Server
  # ==========================================================================
  izara-meeting-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: izara-meeting-api
    restart: unless-stopped
    ports:
      - "3020:3020"
    environment:
      - NODE_ENV=development
      - PORT=3020
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=izara_phase1
      - DB_USER=postgres
      - DB_PASSWORD=P@ssw0rd
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3020/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  default:
    name: izara-network
    external: true
