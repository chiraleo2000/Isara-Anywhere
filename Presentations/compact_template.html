<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คู่มือการใช้งาน IZARA Telemedicine</title>
<style>
  @page {
    size: A4;
    margin: 12mm 12mm 15mm 12mm;
  }

  body {
    font-family: 'Sarabun', 'Noto Sans Thai', 'Tahoma', 'Arial', sans-serif;
    font-size: 9pt;
    line-height: 1.35;
    color: #1a1a1a;
    column-count: 2;
    column-gap: 8mm;
    column-rule: 1px solid #e0e0e0;
    orphans: 3;
    widows: 3;
  }

  h1 {
    column-span: all;
    font-size: 16pt;
    color: #1565c0;
    text-align: center;
    margin: 0 0 2mm 0;
    padding-bottom: 2mm;
    border-bottom: 2px solid #1565c0;
    page-break-before: avoid;
  }

  h1 + p, h1 + blockquote {
    column-span: all;
    text-align: center;
    font-size: 8pt;
    color: #666;
    margin: 0 0 3mm 0;
  }

  h2 {
    column-span: all;
    font-size: 12pt;
    color: #1565c0;
    margin: 4mm 0 2mm 0;
    padding: 1mm 3mm;
    background: #e3f2fd;
    border-left: 3px solid #1565c0;
    page-break-after: avoid;
  }

  h3 {
    font-size: 10pt;
    color: #0d47a1;
    margin: 3mm 0 1mm 0;
    page-break-after: avoid;
    break-after: avoid;
  }

  h4 {
    font-size: 9pt;
    color: #333;
    margin: 2mm 0 1mm 0;
  }

  p {
    margin: 0.5mm 0 1.5mm 0;
    text-align: justify;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 1.5mm auto;
    border: 1px solid #ddd;
    border-radius: 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    page-break-inside: avoid;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 8pt;
    margin: 1.5mm 0;
    page-break-inside: avoid;
  }

  th {
    background: #e3f2fd;
    color: #0d47a1;
    font-weight: bold;
    padding: 1.5mm 2mm;
    border: 1px solid #bbdefb;
    text-align: left;
  }

  td {
    padding: 1mm 2mm;
    border: 1px solid #e0e0e0;
    vertical-align: top;
  }

  td img {
    max-width: 180px;
    margin: 0.5mm 0;
  }

  tr:nth-child(even) {
    background: #f5f5f5;
  }

  ul, ol {
    margin: 0.5mm 0 1.5mm 0;
    padding-left: 5mm;
  }

  li {
    margin-bottom: 0.5mm;
  }

  blockquote {
    margin: 1mm 0 1.5mm 0;
    padding: 1.5mm 3mm;
    background: #fff3e0;
    border-left: 3px solid #ff9800;
    font-size: 8pt;
    page-break-inside: avoid;
  }

  code {
    font-size: 8pt;
    background: #f5f5f5;
    padding: 0.3mm 1mm;
    border-radius: 2px;
  }

  pre {
    font-size: 7.5pt;
    background: #f5f5f5;
    padding: 2mm;
    border: 1px solid #ddd;
    border-radius: 2px;
    overflow-wrap: break-word;
    white-space: pre-wrap;
    page-break-inside: avoid;
  }

  hr {
    border: none;
    border-top: 1px solid #e0e0e0;
    margin: 2mm 0;
    column-span: all;
  }

  strong {
    color: #0d47a1;
  }

  /* Table of contents */
  h2 + ol, h2 + ul {
    column-count: 2;
    column-gap: 5mm;
    font-size: 8.5pt;
  }

  /* Footer info */
  .footer {
    column-span: all;
    text-align: center;
    font-size: 7pt;
    color: #999;
    margin-top: 3mm;
    padding-top: 2mm;
    border-top: 1px solid #e0e0e0;
  }
</style>
</head>
<body>
$body$
</body>
</html>
