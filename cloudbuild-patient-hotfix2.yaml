# Patient Portal hotfix build — rebuilds & redeploys patient portal only.
# Usage:
#   gcloud builds submit . --config=cloudbuild-patient-hotfix2.yaml --project=izara-telemedicine

substitutions:
  _REGION: asia-southeast1
  _REGISTRY: asia-southeast1-docker.pkg.dev/izara-telemedicine/isara-anywhere-portals
  _TAG: v1.7.6
  _GOOGLE_CLIENT_ID: "724889190329-svf2733fjqklfic9tet9d2qkmhkgmu0l.apps.googleusercontent.com"
  _DB_HOST: "35.240.157.230"
  _DB_PORT: "5432"
  _DB_NAME: izara_phase1
  _DB_USER: postgres
  _GEMINI_MODEL: gemini-3.1-flash-lite
  _PATIENT_SVC: izara-patient-portal-dev-testing
  _MEETING_URL: "https://izara-meeting-server-dev-testing-724889190329.asia-southeast1.run.app"

steps:
  - id: build-patient-portal
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.unified
      - -t
      - ${_REGISTRY}/izara-patient-portal:${_TAG}
      - -t
      - ${_REGISTRY}/izara-patient-portal:latest
      - --build-arg
      - VITE_APP_ENV=production
      - --build-arg
      - VITE_APP_VERSION=${_TAG}
      - --build-arg
      - VITE_GCP_PROJECT_ID=${PROJECT_ID}
      - --build-arg
      - VITE_USE_POSTGRESQL=true
      - --build-arg
      - VITE_USE_GCS=false
      - --build-arg
      - GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      - --build-arg
      - VITE_MEETING_SERVER_URL=${_MEETING_URL}
      - .
    dir: Isara-patient-portal

  - id: push-patient-portal
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGISTRY}/izara-patient-portal
    waitFor: [build-patient-portal]

  - id: deploy-patient-portal
    name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_PATIENT_SVC}
      - --image=${_REGISTRY}/izara-patient-portal:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3005
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --timeout=300
      - --set-env-vars=NODE_ENV=production,DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_SSL=false,USE_POSTGRESQL=true,VITE_USE_POSTGRESQL=true,GEMINI_MODEL=${_GEMINI_MODEL},GCP_PROJECT_ID=${PROJECT_ID},MEETING_SERVER_URL=${_MEETING_URL},VITE_MEETING_SERVER_URL=${_MEETING_URL}
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VITE_GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=db-password:latest,DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,VITE_GOOGLE_MAPS_API_KEY=google-maps-api-key:latest,GOOGLE_CLIENT_ID=google-client-id:latest
    waitFor: [push-patient-portal]

images:
  - ${_REGISTRY}/izara-patient-portal:${_TAG}
  - ${_REGISTRY}/izara-patient-portal:latest

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
