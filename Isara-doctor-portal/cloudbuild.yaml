# Cloud Build configuration for Izara Doctor Portal v1.5.2
# Builds unified Docker image and deploys to Cloud Run
# PostgreSQL runs on GCE VM (NOT Cloud SQL, NOT embedded PG)

steps:
  # Build the unified Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "Dockerfile.unified"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:v1.5.2"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:latest"
      - "--build-arg"
      - "VITE_APP_ENV=production"
      - "--build-arg"
      - "VITE_APP_VERSION=2.0.0"
      - "--build-arg"
      - "VITE_GCP_PROJECT_ID=$PROJECT_ID"
      - "."

  # Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal"

  # Deploy to Cloud Run with external PostgreSQL VM (NO Cloud SQL, NO embedded PG)
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "izara-doctor-portal"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:v1.5.2"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--timeout=300"
      - "--cpu-boost"
      - "--execution-environment=gen2"
      - "--set-env-vars=NODE_ENV=production,USE_POSTGRESQL=true,DB_HOST=35.240.157.230,DB_PORT=5432,DB_NAME=izara_phase1,DB_USER=postgres,DB_PASSWORD=IzaraDb2024,DB_SSL=false,VITE_GCP_PROJECT_ID=$PROJECT_ID,VITE_GCP_REGION=asia-southeast1,GEMINI_MODEL=gemini-2.5-flash-lite"
      - "--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VITE_GEMINI_API_KEY=gemini-api-key:latest"

# Store images in Artifact Registry
images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:v1.5.2"
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:latest"

# Build timeout (20 minutes)
timeout: "1200s"

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
