# Cloud Build configuration for Izara Doctor Portal v1.4.8
# Builds unified Docker image and deploys to Cloud Run
# Uses Cloud SQL PostgreSQL (same architecture as local Docker PostgreSQL)

steps:
  # Build the unified Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "Dockerfile.unified"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:v1.4.8"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:latest"
      - "--build-arg"
      - "VITE_APP_ENV=production"
      - "--build-arg"
      - "VITE_GCP_PROJECT_ID=$PROJECT_ID"
      - "."

  # Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal"

  # Deploy to Cloud Run with Cloud SQL PostgreSQL
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "izara-doctor-portal"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:v1.4.8"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--min-instances=1"
      - "--max-instances=10"
      - "--timeout=300"
      - "--cpu-boost"
      - "--execution-environment=gen2"
      - "--set-env-vars=NODE_ENV=production,USE_POSTGRESQL=true,VITE_GCP_PROJECT_ID=$PROJECT_ID,VITE_GCP_REGION=asia-southeast1,POSTGRES_HOST=34.143.228.135,POSTGRES_PORT=5432,DB_HOST=34.143.228.135,DB_PORT=5432,DB_NAME=izara_phase1,DB_USER=postgres,DB_SSL=true,GEMINI_MODEL=gemini-2.5-flash-lite"
      - "--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VITE_GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=db-password:latest,DATABASE_URL=database-url:latest"

# Store images in Artifact Registry
images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:v1.4.8"
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:latest"

# Build timeout (20 minutes)
timeout: "1200s"

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
