# Cloud Build configuration for Izara Doctor Portal v1.5.8
# Builds unified Docker image and deploys to Cloud Run
# PostgreSQL runs on GCE VM (NOT Cloud SQL, NOT embedded PG)

steps:
  # Build the unified Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "Dockerfile.unified"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:v1.5.8"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:latest"
      - "--build-arg"
      - "VITE_APP_ENV=production"
      - "--build-arg"
      - "VITE_APP_VERSION=2.0.0"
      - "--build-arg"
      - "VITE_GCP_PROJECT_ID=$PROJECT_ID"
      - "."

  # Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal"

  # Deploy to Cloud Run with external PostgreSQL VM (NO Cloud SQL, NO embedded PG)
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "izara-doctor-portal-dev-testing"
      - "--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:v1.5.8"
      - "--region=asia-southeast1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=2"
      - "--timeout=300"
      - "--cpu-boost"
      - "--execution-environment=gen2"
      - "--set-env-vars=NODE_ENV=production,USE_POSTGRESQL=true,VITE_USE_POSTGRESQL=true,DB_HOST=35.240.157.230,DB_PORT=5432,DB_NAME=izara_phase1,DB_USER=postgres,DB_SSL=false,DEMO_MODE=false,USE_GCS=false,VITE_USE_GCS=false,GCS_API_URL=http://localhost:3012,MEETING_SERVER_URL=https://izara-meeting-server-dev-testing-724889190329.asia-southeast1.run.app,VITE_MEETING_SERVER_URL=https://izara-meeting-server-dev-testing-724889190329.asia-southeast1.run.app,JITSI_DOMAIN=meet.jit.si,GEMINI_MODEL=gemini-2.5-flash-lite,VITE_GCP_PROJECT_ID=$PROJECT_ID,VITE_GCP_REGION=asia-southeast1"
      - "--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,VITE_GEMINI_API_KEY=gemini-api-key:latest,DB_PASSWORD=db-password:latest,DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest"

# Store images in Artifact Registry
images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:v1.5.8"
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-doctor-portal:latest"

# Build timeout (20 minutes)
timeout: "1200s"

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
