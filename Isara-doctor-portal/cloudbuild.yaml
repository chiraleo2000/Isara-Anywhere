# Cloud Build configuration for Izara Doctor Portal
# Builds unified Docker image and deploys to Cloud Run

steps:
  # Build the unified Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.unified'
      - '-t'
      - 'gcr.io/$PROJECT_ID/izara-doctor-portal:latest'
      - '--build-arg'
      - 'VITE_APP_ENV=production'
      - '--build-arg'
      - 'VITE_GCP_PROJECT_ID=$PROJECT_ID'
      - '.'

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/izara-doctor-portal:latest'

  # Deploy to Cloud Run with Cloud SQL connection via Unix socket
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'izara-doctor-portal'
      - '--image=gcr.io/$PROJECT_ID/izara-doctor-portal:latest'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--timeout=300'
      - '--add-cloudsql-instances=izara-telemedicine:asia-southeast1:izara-db-instance'
      - '--set-env-vars=NODE_ENV=production,USE_POSTGRESQL=true,VITE_GCP_PROJECT_ID=$PROJECT_ID,VITE_GCP_REGION=asia-southeast1,DB_HOST=/cloudsql/izara-telemedicine:asia-southeast1:izara-db-instance,DB_NAME=izara_phase1,DB_USER=izara_localdb_admin'
      - '--set-secrets=DB_PASSWORD=db-password:latest,GEMINI_API_KEY=gemini-api-key:latest'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/izara-doctor-portal:latest'

# Build timeout (20 minutes)
timeout: '1200s'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
