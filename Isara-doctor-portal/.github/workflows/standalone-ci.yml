name: Standalone CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint || true
      - run: npm run type-check || true
      - run: docker build -f Dockerfile.unified -t doctor-test .
