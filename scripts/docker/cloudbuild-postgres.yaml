# Cloud Build configuration for Izara PostgreSQL Database v2.0.0
# Deploys PostgreSQL with pgvector as a Cloud Run service
# Build context: repo root. Submit with: gcloud builds submit --config=scripts/docker/cloudbuild-postgres.yaml .

steps:
  # Build the PostgreSQL image with pgvector
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'scripts/docker/Dockerfile.postgres'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-postgres:v2.0.0'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-postgres:latest'
      - '.'

  # Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-postgres'

  # Deploy PostgreSQL to Cloud Run with persistent volume
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'izara-postgres'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-postgres:v2.0.0'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5432'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--timeout=300'
      - '--set-env-vars=POSTGRES_USER=postgres,POSTGRES_DB=izara_phase1'
      - '--set-secrets=POSTGRES_PASSWORD=db-password:latest'
      - '--execution-environment=gen2'
      - '--cpu-boost'
      - '--no-cpu-throttling'

# Store images in Artifact Registry
images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-postgres:v2.0.0'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-postgres:latest'

# Build timeout (15 minutes)
timeout: '900s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
