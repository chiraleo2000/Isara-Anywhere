# Cloud Build configuration for pgAdmin v2.0.0
# Builds and deploys pgAdmin to Cloud Run for database management
# Build context: repo root. Submit with: gcloud builds submit --config=scripts/docker/cloudbuild-pgadmin.yaml .

steps:
  # Build pgAdmin Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'scripts/docker/Dockerfile.pgadmin'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-pgadmin:latest'
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-pgadmin:v2.0.0'
      - '.'

  # Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-pgadmin'

  # Deploy pgAdmin to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'izara-pgadmin'
      - '--image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-pgadmin:latest'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--timeout=300'
      - '--set-secrets=PGADMIN_DEFAULT_EMAIL=pgadmin-email:latest,PGADMIN_DEFAULT_PASSWORD=pgadmin-password:latest'

# Store images in Artifact Registry
images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-pgadmin:latest'
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/isara-anywhere-portals/izara-pgadmin:v2.0.0'

# Build timeout (10 minutes)
timeout: '600s'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
