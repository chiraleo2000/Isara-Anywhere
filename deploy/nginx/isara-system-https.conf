# 3. Meeting Server (HTTPS + WebSocket / Socket.IO)
server {
    listen 443 ssl http2;
    server_name meeting.isara.local;

    ssl_certificate     /etc/nginx/ssl/isara/isara-local.pem;
    ssl_certificate_key /etc/nginx/ssl/isara/isara-local-key.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# 4. pgAdmin (HTTPS)
server {
    listen 443 ssl http2;
    server_name dbadmin.isara.local;

    ssl_certificate     /etc/nginx/ssl/isara/isara-local.pem;
    ssl_certificate_key /etc/nginx/ssl/isara/isara-local-key.pem;

    location / {
