# Izara Telemedicine — Nginx HTTPS reverse proxy (LAN Mode B + TLS)
# Install: deploy/nginx/UBUNTU_HTTPS_DEPLOYMENT.md
#
# Prerequisites:
#   - Certificates at /etc/nginx/ssl/isara/isara-local.pem (+ -key.pem)
#   - Docker on 127.0.0.1:3005 / 3010 / 3020 / 5050 (docker-compose.yml)
#
#   sudo cp deploy/nginx/isara-system-https.conf /etc/nginx/sites-available/isara-system
#   sudo ln -sf /etc/nginx/sites-available/isara-system /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP → HTTPS (all Izara LAN hosts)
server {
    listen 80;
    server_name patient.isara.local doctor.isara.local meeting.isara.local dbadmin.isara.local;
    return 301 https://$host$request_uri;
}

# Shared TLS settings
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# 1. Patient Portal (HTTPS)
server {
    listen 443 ssl http2;
    server_name patient.isara.local;

    ssl_certificate     /etc/nginx/ssl/isara/isara-local.pem;
    ssl_certificate_key /etc/nginx/ssl/isara/isara-local-key.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# 2. Doctor Portal (HTTPS)
