# Izara Telemedicine — Nginx reverse proxy (LAN / local subdomains)
# Install: see deploy/nginx/LOCAL_DOCKER_DEPLOYMENT.md (Mode B)
#
#   sudo cp deploy/nginx/isara-system.conf /etc/nginx/sites-available/isara-system
#   sudo ln -sf /etc/nginx/sites-available/isara-system /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires Docker ports bound to 127.0.0.1 only (see docker-compose.yml).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Patient Portal
server {
    listen 80;
    server_name patient.isara.local;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO (/ws) and long-polling
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# 2. Doctor Portal
server {
    listen 80;
    server_name doctor.isara.local;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# 3. Meeting Server (WebSocket / Socket.IO)
server {
    listen 80;
    server_name meeting.isara.local;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# 4. pgAdmin Database Manager
server {
    listen 80;
    server_name dbadmin.isara.local;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
